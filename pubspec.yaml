name: life_os
description: "Life OS - 全维人生管理系统"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Router
  go_router: ^14.8.1

  # Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.30
  sqlcipher_flutter_libs: ^0.6.5
  path_provider: ^2.1.5
  path: ^1.9.1

  # Event Bus
  event_bus: ^2.0.1

  # Background Tasks
  workmanager: ^0.5.2

  # Animation
  rive: ^0.13.20

  # Charts
  fl_chart: ^0.70.2

  # ML Kit
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_image_labeling: ^0.14.2
  image_picker: ^1.1.2

  # Biometrics
  local_auth: ^2.3.0

  # Calendar
  table_calendar: ^3.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  drift_dev: ^2.25.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4

  # Testing
  mockito: ^5.4.5
  mocktail: ^1.0.4
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
